
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-incident-investigation"
version = "0.1.0"
description = "Incident Response & Investigation System"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "pydantic>=2,<3",
    "networkx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
